name: Release HACS package
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements_test.txt
      - run: python -m pytest
      - run: python scripts/build_release.py
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/atodosol_solarman.zip
